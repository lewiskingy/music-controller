<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Controller · Prototype</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="device" aria-label="Music controller prototype">
    <header class="topbar"><strong>Music Controller</strong><label for="player">Player <select id="player"><option value="">Connect first</option></select></label></header>
    <section class="screen">
      <div id="art" class="art" aria-label="Placeholder album artwork"><span>♪</span></div>
      <div class="details">
        <p class="eyebrow">NOW PLAYING · MUSIC ASSISTANT</p>
        <h1 id="track">Not connected</h1>
        <p id="artist">Sign in to Music Assistant</p>
        <p id="album"></p>
        <div class="transport">
          <button id="prev" type="button" disabled aria-label="Previous track">⏮</button>
          <button id="toggle" type="button" disabled aria-label="Pause">⏸</button>
          <button id="next" type="button" disabled aria-label="Next track">⏭</button>
        </div>
        <label class="volume" for="volume">Volume <output id="volumeValue">35%</output></label>
        <input id="volume" type="range" min="0" max="100" value="35" disabled>
      </div>
    </section>
    <nav aria-label="Controller sections">
      <button type="button" data-view="Now Playing" aria-current="page">Now Playing</button>
      <button type="button" data-view="Browse">Browse</button>
      <button type="button" data-view="Queue">Queue</button>
      <button type="button" data-view="Players">Players</button>
    </nav>
    <form id="login" class="login">
      <label>Music Assistant username <input id="username" autocomplete="username" required></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Connect</button>
    </form>
    <p id="status" role="status">Connect to Music Assistant to see live playback.</p>
  </main>
</body>
</html>
