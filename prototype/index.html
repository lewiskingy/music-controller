<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Controller · Prototype</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="device" aria-label="Music controller prototype">
    <header class="topbar"><strong>Music Controller</strong><span id="room">Living Room · Demo</span></header>
    <section class="screen">
      <div id="art" class="art" aria-label="Placeholder album artwork"><span>♪</span></div>
      <div class="details">
        <p class="eyebrow">NOW PLAYING · SAMPLE DATA</p>
        <h1 id="track">Tejano Blue</h1>
        <p id="artist">Cigarettes After Sex</p>
        <p id="album">X's</p>
        <div class="transport">
          <button id="prev" type="button" aria-label="Previous track">⏮</button>
          <button id="toggle" type="button" aria-label="Pause">⏸</button>
          <button id="next" type="button" aria-label="Next track">⏭</button>
        </div>
        <label class="volume" for="volume">Volume <output id="volumeValue">35%</output></label>
        <input id="volume" type="range" min="0" max="100" value="35">
      </div>
    </section>
    <nav aria-label="Controller sections">
      <button type="button" data-view="Now Playing" aria-current="page">Now Playing</button>
      <button type="button" data-view="Browse">Browse</button>
      <button type="button" data-view="Queue">Queue</button>
      <button type="button" data-view="Players">Players</button>
    </nav>
    <p id="status" role="status">Demo only — controls update sample state, not Music Assistant.</p>
  </main>
</body>
</html>
