name: Release Music Controller
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
  installer:
    needs: version
    uses: ./.github/workflows/installer.yml
  firmware:
    needs: version
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Build release firmware
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          cd firmware/esp32
          idf.py set-target esp32s3
          idf.py build
          python check_memory_layout.py build/music_controller.elf
      - name: Prepare verified flash assets and hardware manifest
        env:
          VERSION: ${{ github.ref_name }}
        run: python installer/build_manifest.py firmware/esp32/build dist/release "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: music-controller-release-firmware
          path: dist/release/
          if-no-files-found: error
  gateway:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r gateway/requirements.txt pytest==8.4.2
      - run: python -m pytest gateway/tests -q
      - run: docker build -t music-controller-gateway:${{ github.ref_name }} gateway
  publish:
    needs: [installer, firmware, gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: music-controller-*
          merge-multiple: true
          path: dist/release
      - name: Package prototype and gateway source from the same tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          tar -czf "dist/release/music-controller-${VERSION}.tar.gz" -C prototype .
          tar -czf "dist/release/music-controller-gateway-${VERSION}.tar.gz" gateway
          cd dist/release
          sha256sum *.bin *.exe *.json *.tar.gz > SHA256SUMS
      - name: Publish all assets together
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/release/*
          else
            gh release create "$VERSION" dist/release/* --verify-tag --title "Music Controller $VERSION" --generate-notes
          fi
