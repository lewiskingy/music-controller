name: Prepare draft release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional vMAJOR.MINOR.PATCH override (blank = refresh rolling draft or next patch)'
        type: string
        default: ''
permissions:
  contents: read
# Serialize version allocation through upload, including manual/tag runs.
# Queuing preserves merges while a long firmware/Windows build is running.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.number) || 'music-controller-draft-releases' }}
  cancel-in-progress: false
  queue: max
jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/release -q
  version:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: release-tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select rolling candidate version (fixed for this build)
        id: select
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          ROLLING: ${{ github.ref == 'refs/heads/main' && '--rolling' || '' }}
          TAG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/prepare_release.py select --version "${TAG_VERSION:-$REQUESTED_VERSION}" ${ROLLING}
  installer:
    needs: version
    uses: ./.github/workflows/installer.yml
  firmware:
    needs: version
    uses: ./.github/workflows/firmware.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
  gateway:
    needs: version
    uses: ./.github/workflows/gateway.yml
  prototype:
    needs: version
    uses: ./.github/workflows/prototype.yml
  draft:
    needs: [version, installer, firmware, gateway, prototype]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: music-controller-release-firmware
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: music-controller-windows
          path: dist/release
      - name: Package prototype and gateway from the tested commit
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp LICENSE NOTICE THIRD_PARTY.md dist/release/
          tar -czf "dist/release/music-controller-prototype-${VERSION}.tar.gz" LICENSE NOTICE THIRD_PARTY.md -C prototype .
          tar -czf "dist/release/music-controller-gateway-${VERSION}.tar.gz" LICENSE NOTICE THIRD_PARTY.md gateway
      - name: Verify assets and prepare draft (never publish)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          ROLLING: ${{ github.ref == 'refs/heads/main' && '--rolling' || '' }}
        run: python scripts/prepare_release.py prepare --version "$VERSION" ${ROLLING}
