name: Browser prototype checks
on:
  pull_request:
    paths:
      - 'prototype/**'
      - 'tests/prototype/**'
      - 'contracts/**'
      - '.github/workflows/prototype.yml'
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'tests/prototype/**'
      - 'contracts/**'
      - '.github/workflows/prototype.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/prototype -q
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < prototype/app.js
          node --input-type=module --check < prototype/music-assistant.js
      - name: Verify release files exist
        run: test -s prototype/index.html && test -s prototype/styles.css
