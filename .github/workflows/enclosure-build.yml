name: Enclosure build checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hardware/enclosure/requirements.txt
      - name: Install CAD and rendering dependencies
        run: python -m pip install -r hardware/enclosure/requirements.txt
      - name: Verify portrait mounting, contact alignment and dock key
        run: python hardware/enclosure/test_geometry.py -v
      - name: Build, check board clearance and render PNGs
        run: python hardware/enclosure/build.py --output dist/enclosure --check-board
      - name: Upload print files and CAD
        id: print-files
        uses: actions/upload-artifact@v4
        with:
          name: controller-enclosure-${{ github.sha }}
          path: dist/enclosure/
          if-no-files-found: error
          retention-days: 30
      - name: Upload rendered previews
        id: renders
        uses: actions/upload-artifact@v4
        with:
          name: controller-enclosure-renders-${{ github.sha }}
          path: dist/enclosure/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Link downloadable outputs
        env:
          PRINT_URL: ${{ steps.print-files.outputs.artifact-url }}
          RENDER_URL: ${{ steps.renders.outputs.artifact-url }}
        run: |
          {
            echo '## Enclosure and dock'
            echo
            echo "[Print files, CAD and assembly instructions]($PRINT_URL)"
            echo
            echo "[Rendered PNG previews]($RENDER_URL)"
            echo
            echo 'CAD/mesh/board-clearance checks passed. Physical fit and selected battery/contact hardware still need checking.'
          } >> "$GITHUB_STEP_SUMMARY"
