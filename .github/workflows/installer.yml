name: Windows installer
on:
  push:
    branches: [main]
    paths: ['installer/**', '.github/workflows/installer.yml']
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r installer/requirements.txt pyinstaller==6.16.0 pytest==8.4.2
      - run: python -m pytest installer/tests -q
      - name: Build self-contained executables
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name music-controller-setup --paths installer --collect-all esptool --collect-all esp_idf_nvs_partition_gen --collect-all serial installer/setup.py
          python -m PyInstaller --noconfirm --clean --onefile --console --name music-controller-cli --paths installer --collect-all esptool --collect-all esp_idf_nvs_partition_gen --collect-all serial installer/setup.py
      - name: Smoke test frozen runtime
        run: dist/music-controller-cli.exe --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: music-controller-windows
          path: dist/music-controller-*.exe
          if-no-files-found: error
