name: Windows installer
on:
  pull_request:
    paths: ['installer/**', '.github/workflows/installer.yml', '.github/workflows/release-prototype.yml']
  push:
    branches: [main]
    paths: ['installer/**', '.github/workflows/installer.yml']
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r installer/requirements.txt pyinstaller==6.16.0 pytest==8.4.2
      - run: python -m pytest installer/tests -q
      - name: Build self-contained executables
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name music-controller-setup --paths installer --add-data "LICENSE:licensing" --add-data "NOTICE:licensing" --add-data "THIRD_PARTY.md:licensing" --collect-all esptool --collect-all esp_idf_nvs_partition_gen --collect-all serial installer/setup.py
          python -m PyInstaller --noconfirm --clean --onefile --console --name music-controller-cli --paths installer --add-data "LICENSE:licensing" --add-data "NOTICE:licensing" --add-data "THIRD_PARTY.md:licensing" --collect-all esptool --collect-all esp_idf_nvs_partition_gen --collect-all serial installer/setup.py
      - name: Smoke test frozen runtime
        run: dist/music-controller-cli.exe --self-test
      - name: Include licence and attribution with installer downloads
        run: Copy-Item LICENSE, NOTICE, THIRD_PARTY.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: music-controller-windows
          path: |
            dist/music-controller-*.exe
            dist/LICENSE
            dist/NOTICE
            dist/THIRD_PARTY.md
          if-no-files-found: error
