name: ESP32 firmware
on:
  pull_request:
    paths:
      - 'firmware/esp32/**'
      - '.github/workflows/firmware.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/esp32/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    defaults:
      run:
        shell: bash
        working-directory: firmware/esp32
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
      - name: Package firmware with checksums
        run: |
          set -euo pipefail
          mkdir -p ../../dist/esp32
          cp build/bootloader/bootloader.bin ../../dist/esp32/
          cp build/partition_table/partition-table.bin ../../dist/esp32/
          cp build/music_controller.bin ../../dist/esp32/
          cp build/flash_args ../../dist/esp32/
          (cd ../../dist/esp32 && sha256sum *.bin flash_args > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: music-controller-esp32s3-${{ github.sha }}
          path: dist/esp32/
          if-no-files-found: error
          retention-days: 30
